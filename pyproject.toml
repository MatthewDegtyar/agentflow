[project]
name = "agentflow"
version = "0.1.0"
description = "YAML-defined agent workflows where each step is its own repo: runtime, queues, flow metrics, event log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.7",
    "duckdb>=1.1",
    "pytz>=2024.1",  # DuckDB needs it to return TIMESTAMPTZ values
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
